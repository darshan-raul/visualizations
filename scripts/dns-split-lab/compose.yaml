# A split DNS lab for the DNS page. Run through scripts/verify-dns-split.mjs.
name: dns-split-lab
networks:
  home: { ipam: { config: [{ subnet: 172.30.1.0/24 }] } }
  vpn: { ipam: { config: [{ subnet: 172.30.2.0/24 }] } }
  cloud: { ipam: { config: [{ subnet: 172.30.3.0/24 }] } }
x-coredns: &coredns
  image: coredns/coredns:1.11.3
  volumes: ['./:/zones:ro']
services:
  public:
    <<: *coredns
    command: ['-conf', '/zones/Corefile.public']
    networks: { home: { ipv4_address: 172.30.1.10 }, cloud: { ipv4_address: 172.30.3.10 } }
  vpc:
    <<: *coredns
    command: ['-conf', '/zones/Corefile.vpc']
    networks: { cloud: { ipv4_address: 172.30.3.20 } }
  corp:
    <<: *coredns
    command: ['-conf', '/zones/Corefile.corp']
    networks: { vpn: { ipv4_address: 172.30.2.30 }, cloud: { ipv4_address: 172.30.3.30 } }
  laptop:
    build: { context: ., dockerfile: Dockerfile.laptop }
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    volumes: ['/sys/fs/cgroup:/sys/fs/cgroup:rw', './laptop-resolv.conf:/etc/resolv.conf:ro', './:/zones:ro']
    networks: { home: { ipv4_address: 172.30.1.100 }, vpn: { ipv4_address: 172.30.2.100 } }
